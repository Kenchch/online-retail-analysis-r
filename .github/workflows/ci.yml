name: R CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install project dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: |
            any::readr
            any::dplyr
            any::lubridate
            any::ggplot2
            any::scales
            any::svglite
            any::stringr
            any::DBI
            any::RSQLite
            any::zoo
            any::forecast
            any::knitr
            any::rmarkdown

      - name: Download and verify source data
        run: Rscript R/get_data.R

      - name: Run tests
        run: Rscript tests/run_tests.R

      - name: Rebuild analysis and report
        run: Rscript run_analysis.R
